<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sticky Studio</title>

        <style>
            html {
                background: gray;
                font: medium / 1.5 sans-serif;
            }

            body {
                margin: unset;
            }

            header {
                padding: 0.5rem;
            }

            ul {
                margin: unset;
                padding: unset;
                list-style: none;
            }

            li {
                display: block;
                padding: 0.5rem;
            }

            .contextual {
                position: relative;
            }

            .contextual > :last-child {
                position: absolute;
                background: gray;
            }

            .contextual:not(:focus-within) > :last-child {
                height: 0;
                overflow: hidden;
            }
        </style>

        <script type="importmap">
            {
                "imports": {}
            }
        </script>
        <script type="module" src="/examples/play.js"></script>
    </head>

    <body>
        <studio-app>
            <header>
                &nbsp;
                <div class="contextual">
                    <button>Menu</button>
                    <ul>
                        <li>New</li>
                    </ul>
                </div>
            </header>
        </studio-ui>
    </body>
</html>
