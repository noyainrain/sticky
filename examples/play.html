<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sticky Studio</title>

        <style>
            html {
                background: gray;
                font: medium / 1.5 sans-serif;
            }

            body {
                margin: unset;
            }

            header {
                padding: 0.5rem;
            }

            ul {
                margin: unset;
                padding: unset;
                list-style: none;
                cursor: pointer;
            }

            li {
                display: block;
                padding: 0.5rem;
            }

            .contextual {
                position: relative;
                white-space: nowrap;
            }

            .contextual > :last-child {
                position: absolute;
                right: 0;
                background: gray;
            }

            .contextual:not(:focus-within) > :last-child {
                height: 0;
                overflow: hidden;
            }

            html,
            body,
            studio-app {
                height: 100vh;
            }

            studio-app {
                display: flex;
                flex-flow: column;
            }

            main {
                flex: auto;
                display: flex;
            }

            textarea {
                display: block;
                flex: auto;
                border: none;
                overflow: scroll;
                white-space: pre;
                tab-size: 4;

                /*min-width: 0;
                flex: 1 1 0;*/
            }
        </style>

        <script type="importmap">
            {
                "imports": {
                    "p5": "/node_modules/p5/lib/p5.esm.min.js",
                    "#sticky": "/src/sticky.js"
                }
            }
        </script>
        <script type="module" src="/examples/play.js"></script>
    </head>

    <body>
        <studio-app>
            <header>
                &nbsp;
                <input type="text"></input>
                <div class="contextual">
                    <button>Menu</button>
                    <ul>
                        <li id="create-model" tabindex="0">New</li>
                    </ul>
                </div>
            </header>
            <main>
                <textarea spellcheck="false"></textarea>
            </main>
        </studio-ui>
    </body>
</html>
