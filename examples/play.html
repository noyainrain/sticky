<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sticky Studio</title>

        <style>
            html,
            dialog {
                background: gray;
                font: medium / 1.5 sans-serif;
            }

            body {
                margin: unset;
            }

            header,
            p {
                padding: 0.5rem;
                margin: unset;
            }

            ul {
                margin: unset;
                padding: unset;
                list-style: none;
                cursor: pointer;
            }

            li {
                display: block;
                padding: 0.5rem;
            }

            header {
                display: flex;
            }

            header > h1 {
                flex: auto;
            }

            .contextual {
                position: relative;
                white-space: nowrap;
            }

            .contextual > :last-child {
                position: absolute;
                right: 0;
                background: gray;
            }

            .contextual:not(:focus-within) > :last-child {
                height: 0;
                overflow: hidden;
            }

            html,
            body,
            studio-app {
                height: 100vh;
            }

            studio-app {
                display: flex;
                flex-flow: column;
            }

            header h1 {
                font-size: 1rem;
            }

            main {
                flex: auto;
                display: flex;
            }

            textarea {
                display: block;
                width: 80ch;
                border: none;
                overflow: scroll;
                white-space: pre;
                tab-size: 4;

                /*min-width: 0;
                flex: 1 1 0;*/
            }

            footer:has(p:empty) {
                display: none;
            }

            footer p {
                color: red;
                background: pink;
            }

            #canvas {
                /*min-width: 0;
                flex: 1 1 0;*/
            }
        </style>

        <script type="importmap">
            {
                "imports": {
                    "p5": "/node_modules/p5/lib/p5.esm.min.js",
                    "#sticky": "/src/sticky.js"
                }
            }
        </script>
        <script type="module" src="/examples/play.js"></script>
    </head>

    <body>
        <studio-app>
            <header>
                <h1></h1>
                <span>&nbsp;</span>
                <div class="contextual">
                    <button>Menu</button>
                    <ul>
                        <li id="create-model" tabindex="0">New</li>
                        <li id="open-model-dialog" tabindex="0">Open Model</li>
                        <li id="open-rename-dialog" tabindex="0">Rename</li>
                        <li id="download" tabindex="0">Download</li>
                        <li id="open-record-dialog" tabindex="0">Record</li>
                    </ul>
                </div>
            </header>
            <main>
                <textarea spellcheck="false"></textarea>
                <div id="canvas"></div>
            </main>
            <footer>
                <p></p>
            </footer>

            <studio-open-model-dialog>
                <dialog closedby="any">
                    <h2>Open Model</h2>
                    <ul></ul>
                </dialog>
            </studio-open-model-dialog>

            <studio-rename-dialog>
                <dialog closedby="any">
                    <h2>Rename Model</h2>
                    <input></input>
                    <button>Done</button>
                </dialog>
            </studio-rename-dialog>

            <dialog id="record-dialog" closedby="any">
                <header>
                    <h2>Record</h2>
                    <button id="record">Record</button>
                </header>
                <div id="record-canvas"></div>
            </dialog>
        </studio-ui>
    </body>
</html>
